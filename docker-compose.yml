# Docker Compose for Nudge ERP local development
services:
  postgres:
    image: postgres:16-alpine
    container_name: nudge-postgres
    environment:
      POSTGRES_USER: nudge
      POSTGRES_PASSWORD: nudge_dev_password
      POSTGRES_DB: nudge_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nudge -d nudge_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nudge-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
